[[conversation]]
label = "dream:scout"

[conversation.claude]
prompt = "/dream:scout GH{issue}"
model = "opus"
effort = "high"

[conversation.codex]
prompt = "$dream:scout GH{issue}"
model = "gpt-5.6-sol"
effort = "high"

[[assignment]]
label = "dream:smith"

[assignment.claude]
prompt = "/dream:smith GH{issue}"
model = "opus[1m]"
effort = "high"

[assignment.codex]
prompt = "$dream:smith GH{issue}"
model = "gpt-5.6-sol"
effort = "high"
config = { model_context_window = 1000000, model_auto_compact_token_limit = 900000 }

[[assignment]]
label = "dream:less"

[assignment.claude]
prompt = "/dream:less GH{issue}"
model = "opus"
effort = "medium"

[assignment.codex]
prompt = "$dream:less GH{issue}"
model = "gpt-5.6-sol"
effort = "medium"
