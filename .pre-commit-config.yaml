repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        # Skip markdown that is not authored source: the CLAUDE.md symlink to
        # AGENTS.md, and the uncoded-generated skill files. The markdown lint,
        # format, and link-check hooks share this list, so they never drift on
        # which paths to skip.
        exclude: &markdown_non_source (^CLAUDE\.md$|^\.claude/|^\.agents/)

  - repo: local
    hooks:
      - id: uncoded
        name: maintain documentation index
        entry: uvx uncoded@2 sync
        language: system
        pass_filenames: false
        files: (\.md$|^\.uncoded\.toml$)

      - id: prettier
        name: format markdown with prettier
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.8.1"]
        args: ["--write"]
        files: \.md$
        exclude: *markdown_non_source

      - id: check-invisible-chars
        name: check for invisible characters
        entry: python3 scripts/check_invisible_chars.py
        language: python
        types: [text]

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: claude-plugin-validate
        name: claude plugin validate (plugin manifest)
        entry: claude plugin validate plugins/dream
        language: system
        files: ^plugins/dream/\.codex-plugin/plugin\.json$
        pass_filenames: false

      - id: claude-marketplace-validate
        name: claude plugin validate (marketplace manifest)
        entry: claude plugin validate .
        language: system
        files: ^\.claude-plugin/marketplace\.json$
        pass_filenames: false

      - id: validate-skill
        name: validate skill frontmatter and heading
        entry: python3 scripts/validate_skill.py
        language: python
        additional_dependencies: [pyyaml]
        files: ^plugins/.+/skills/.+/SKILL\.md$

      - id: validate-agent
        name: validate agent frontmatter
        entry: python3 scripts/validate_agent.py
        language: python
        additional_dependencies: [pyyaml]
        files: ^plugins/.+/agents/.+\.md$

      - id: remark-validate-links
        name: validate markdown links
        entry: remark
        language: node
        additional_dependencies: ["remark-cli@^12.0.1", "remark-validate-links@^13.1.0"]
        args: ["--quiet", "--frail", "--use", "remark-validate-links"]
        files: \.md$
        exclude: *markdown_non_source
