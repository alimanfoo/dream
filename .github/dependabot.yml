version: 2

# A group covers either version updates or security updates, not both. So each
# ecosystem has two groups, and opens one pull request for each, majors included.
# A version update waits until its release is a week old, so a compromised
# release has time to be found and pulled first. Security updates do not wait.
# Dependabot has no security updates for pre-commit, so it has one group.

updates:
  # The uv ecosystem also updates docs/requirements.txt.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
